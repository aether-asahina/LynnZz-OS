<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LynnZz OS</title>

<style id="lynnzz-login-ring">
.login-ring-wrap{
  position:relative;
  overflow:hidden;
  border-radius:var(--login-r);
  padding:0;
}

.login-ring-wrap>.login-ring-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
  pointer-events:none;
}

.login-ring-wrap>.login-ring-svg path{
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-dasharray:100;
  stroke-dashoffset:100;
  animation:lzDrawLine 1.6s ease-out forwards;
}

.login-ring-inner{
  position:relative;
  z-index:2;
  width:calc(100% - (var(--login-thick)*2));
  height:calc(100% - (var(--login-thick)*2));
  margin:var(--login-thick);
  background:rgba(21,21,31,.96);
  border-radius:calc(var(--login-r) - var(--login-thick));
}

.auth-card.login-ring-wrap{
  border:none;
  background:transparent;
  padding:0;
}

.auth-card.login-ring-wrap>.login-ring-inner{
  padding:32px 28px;
}

.login-field-ring{
  --login-r:10px;
  --login-thick:1.5px;
  min-height:42px;
}

.login-field-ring .login-ring-svg path{
  stroke-width:1.5;
}

.login-field-ring .login-ring-inner{
  background:rgba(21,21,31,.96);
}

.login-field-ring .login-ring-inner input{
  border:none!important;
  background:transparent!important;
  outline:none;
  height:100%;
}

.login-ring-idle{
  display:none!important;
}

.login-reveal{
  opacity:0;
  transform:translateY(10px);
  animation:lzReveal .5s ease-out forwards;
}

.login-ring-wrap.ring-ready>.login-ring-svg path{
  stroke-dasharray:18 82;
  stroke-dashoffset:0;
  animation:lzBorderSpin 2.5s linear infinite;
}

.login-field-ring.ring-ready>.login-ring-svg path{
  stroke-dasharray:20 80;
  stroke-dashoffset:0;
  animation:lzBorderSpin 2s linear infinite;
}

@keyframes lzDrawLine{
  to{stroke-dashoffset:0;}
}

@keyframes lzBorderSpin{
  to{stroke-dashoffset:-100;}
}

@keyframes lzReveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>
<body>

<!-- ===================== BOOT SCREEN ===================== -->
<div id="boot-screen" class="screen">
  <div class="boot-logo">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
      <path d="M36 4 L64 20 V52 L36 68 L8 52 V20 Z" stroke="url(#bootGrad)" stroke-width="2.5" fill="rgba(123,47,247,0.08)"/>
      <path d="M28 24 L28 48 L44 48" stroke="url(#bootGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="bootGrad" x1="0" y1="0" x2="72" y2="72">
          <stop offset="0" stop-color="#a855f7"/>
          <stop offset="1" stop-color="#ff2e63"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div class="boot-title">LynnZz<span>OS</span></div>
  <div class="boot-version">v1.0</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
  <div class="boot-status" id="boot-status">Menyalakan sistem…</div>
</div>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-bg-orb orb1"></div>
  <div class="auth-bg-orb orb2"></div>

  <div class="auth-card login-ring-wrap" style="--login-r:20px;--login-thick:2px;">
    <svg class="login-ring-svg" aria-hidden="true">
      <path pathLength="100" stroke="url(#loginCardGrad)" d=""></path>
      <defs>
        <linearGradient id="loginCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="login-ring-idle"></div>

    <div class="login-ring-inner">
      <div class="auth-brand login-reveal">
        <div class="auth-brand-mark">Lz</div>
        <div class="auth-brand-text">LynnZz<span>OS</span></div>
      </div>

    <!-- LOGIN -->
    <form id="login-form" class="auth-form login-reveal">
      <h1>Masuk</h1>
      <p class="auth-sub">Lanjutkan ke workspace lo.</p>

      <label class="field login-reveal">
        <span>Email</span>
        <div class="login-field-ring login-ring-wrap">
          <svg class="login-ring-svg" aria-hidden="true">
            <path pathLength="100" stroke="url(#loginEmailGrad)" d=""></path>
            <defs>
              <linearGradient id="loginEmailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="login-ring-idle"></div>
          <div class="login-ring-inner">
            <input type="email" id="login-email" required placeholder="nama@email.com" autocomplete="email">
          </div>
        </div>
      </label>
      <label class="field login-reveal">
        <span>Kata sandi</span>
        <div class="login-field-ring login-ring-wrap">
          <svg class="login-ring-svg" aria-hidden="true">
            <path pathLength="100" stroke="url(#loginPassGrad)" d=""></path>
            <defs>
              <linearGradient id="loginPassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="login-ring-idle"></div>
          <div class="login-ring-inner">
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>
      </label>

      <div class="auth-error login-reveal" id="login-error"></div>

      <button type="submit" class="btn-primary login-reveal">Masuk</button>
      <button type="button" class="btn-ghost login-reveal" id="btn-guest">Masuk sebagai Tamu</button>

      <p class="auth-switch">Belum punya akun? <a href="#" id="go-register">Daftar</a></p>
    </form>

    <!-- REGISTER -->
    <form id="register-form" class="auth-form hidden login-reveal">
      <h1>Daftar</h1>
      <p class="auth-sub">Bikin akun buat nyimpen data lo di cloud.</p>

      <label class="field">
        <span>Nama</span>
        <input type="text" id="register-name" required placeholder="Nama lo">
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" id="register-email" required placeholder="nama@email.com" autocomplete="email">
      </label>
      <label class="field">
        <span>Kata sandi</span>
        <input type="password" id="register-password" required placeholder="Minimal 6 karakter" autocomplete="new-password">
      </label>

      <div class="auth-error" id="register-error"></div>

      <button type="submit" class="btn-primary">Buat Akun</button>

      <p class="auth-switch">Udah punya akun? <a href="#" id="go-login">Masuk</a></p>
    </form>
    </div>
  </div>
</div>

<!-- ===================== DESKTOP ===================== -->
<div id="desktop-screen" class="screen hidden">

  <div id="wallpaper"><canvas id="wallpaper-canvas"></canvas></div>

  <!-- Desktop Widgets -->
  <div id="desktop-widgets">
    <div class="desktop-widget system-widget" id="system-widget">
      <div class="system-head">
        <div>
          <div class="widget-label">LYNNZZ OS</div>
          <div class="system-title">System Monitor</div>
        </div>

        <div class="system-actions">
          <span class="system-status">
            <span class="system-dot"></span> ON
          </span>

          <button class="system-toggle" id="system-widget-toggle" title="Minimize">−</button>
        </div>
      </div>

      <div class="system-info">
        <div class="system-row">
          <span>RAM</span>
          <strong id="system-ram">--</strong>
        </div>
        <div class="system-row">
          <span>UPTIME</span>
          <strong id="system-uptime">00:00:00</strong>
        </div>
        <div class="system-row">
          <span>DEVICE</span>
          <strong id="system-device">--</strong>
        </div>
        <div class="system-row">
          <span>SCREEN</span>
          <strong id="system-screen">--</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- Desktop icons -->
  <div id="desktop-icons"></div>

  <!-- Windows render here -->
  <div id="window-layer"></div>

  <!-- Notification stack -->
  <div id="notification-stack"></div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn">
      <span class="start-mark">Lz</span>
      <span class="start-label">Start</span>
    </button>

    <div id="taskbar-apps"></div>

    <div id="tray">
      <button id="tray-notif" title="Notifikasi">🔔</button>
      <div id="tray-clock">
        <span id="tray-time">--:--</span>
        <span id="tray-date">-- --- ----</span>
      </div>
    </div>
  </div>

  <!-- Start menu -->
<div id="start-menu" class="hidden">
  <div class="start-menu-header">
    <div class="user-avatar" id="sm-avatar">?</div>
    <div class="user-meta">
      <div class="user-name" id="sm-username">Pengguna</div>
      <div class="user-email" id="sm-email">-</div>
    </div>
  </div>

  <div class="start-menu-search">
    <span>⌕</span>
    <input
      id="start-menu-search"
      type="text"
      placeholder="Cari aplikasi..."
      autocomplete="off"
    >
  </div>

  <div class="start-menu-section-title">Aplikasi</div>

  <div class="start-menu-apps" id="start-menu-apps"></div>

  <div class="start-menu-footer">
      <button id="btn-lock">🔒 Kunci</button>
      <button id="btn-logout">⏻ Keluar</button>
    </div>
</div>
  </div>
</div>

<script>
(function initLynnZzLoginRings() {
  function roundedRectPath(w, h, r) {
    r = Math.min(r, w / 2, h / 2);

    return [
      'M', r, 0,
      'H', w - r,
      'A', r, r, 0, 0, 1, w, r,
      'V', h - r,
      'A', r, r, 0, 0, 1, w - r, h,
      'H', r,
      'A', r, r, 0, 0, 1, 0, h - r,
      'V', r,
      'A', r, r, 0, 0, 1, r, 0,
      'Z'
    ].join(' ');
  }

  function updateLoginRings() {
    document.querySelectorAll('.login-ring-wrap').forEach(function(el) {
      var svg = el.querySelector(':scope > .login-ring-svg');
      var path = svg && svg.querySelector('path');

      if (!svg || !path) return;

      var rect = el.getBoundingClientRect();

      if (!rect.width || !rect.height) return;

      var radius =
        parseFloat(getComputedStyle(el).getPropertyValue('--login-r')) || 10;

      svg.setAttribute('viewBox', '0 0 ' + rect.width + ' ' + rect.height);
      svg.setAttribute('preserveAspectRatio', 'none');
      path.setAttribute('d', roundedRectPath(rect.width, rect.height, radius));

      if (el.dataset.ringReady !== '1') {
        el.dataset.ringReady = '1';

        setTimeout(function() {
          el.classList.add('ring-ready');
        }, 1600);
      }
    });
  }

  window.addEventListener('load', function() {
    updateLoginRings();

    if (window.ResizeObserver) {
      var ringResizeObserver = new ResizeObserver(function() {
        updateLoginRings();
      });

      document.querySelectorAll('.login-ring-wrap').forEach(function(el) {
        ringResizeObserver.observe(el);
      });
    }
  });

  var authScreen = document.getElementById('auth-screen');

  if (authScreen) {
    var observer = new MutationObserver(function() {
      updateLoginRings();
    });

    observer.observe(authScreen, {
      attributes: true,
      attributeFilter: ['class']
    });
  }

  updateLoginRings();
})();
</script>
